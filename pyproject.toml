[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aretil"
version = "0.0.0"
description = "aretil — legal experience-management data layer (Python data/ML core)"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.2,<1.6",
    "splink>=4.0.16,<5",
    "pandas>=2",
    "model2vec>=0.8,<1",
    "anthropic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
# The Python core is scripts plus tests, not an importable package.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py310"
